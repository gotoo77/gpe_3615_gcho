[package]
name = "gpe-3615-gcho"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/gotoo77/gpe_3615_gcho"

[lib]
name = "gpe_3615_gcho"
path = "src/lib.rs"

[[bin]]
name = "gcho"
path = "src/main.rs"

[[bin]]
name = "gcho-web"
path = "src/bin/gcho_web.rs"

[dependencies]
gotoo-pixel-engine = { git = "https://github.com/gotoo77/gotoo-pixel-engine.git", rev = "40e0af0f9fbce15a2a3847fd054031139230c2b6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
