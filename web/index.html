<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>3615 GCHO</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        width: min(100vw, 960px);
        height: auto;
        max-height: 100vh;
        aspect-ratio: 4 / 3;
        image-rendering: pixelated;
        touch-action: none;
      }
      #fatal {
        display: none;
        position: fixed;
        inset: auto 1rem 1rem 1rem;
        margin: 0;
        color: #e1e8da;
        font: 14px monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <pre id="fatal"></pre>
    <script type="module">
      import init from "./pkg/gcho-web.js";
      init().catch((error) => {
        const fatal = document.getElementById("fatal");
        fatal.style.display = "block";
        fatal.textContent = `ERREUR TERMINAL\n${error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
