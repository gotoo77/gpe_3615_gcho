name: Deploy 3615 GCHO to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Refresh editorial snapshot opportunistically
        shell: bash
        run: |
          if ! python3 tools/generate_content.py; then
            echo "::warning::content refresh failed; using committed valid snapshot"
          fi
          python3 tools/generate_content.py --check

      - name: Build Web application
        run: |
          cargo build --release --target wasm32-unknown-unknown --bin gcho-web
          mkdir -p dist/pkg dist/content
          wasm-bindgen \
            --target web \
            --out-name gcho-web \
            --out-dir dist/pkg \
            target/wasm32-unknown-unknown/release/gcho-web.wasm
          cp web/index.html dist/index.html
          cp content/*.json dist/content/
          test -f dist/index.html
          test -f dist/pkg/gcho-web.js
          test -f dist/pkg/gcho-web_bg.wasm
          grep -Fq './pkg/gcho-web.js' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
